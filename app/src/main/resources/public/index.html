<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks | CodeAlpha Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F7FC; --grid: #E2E7F2; --panel: #FFFFFF; --line: #D3DBEB;
      --text: #1B2235; --muted: #5C6782; --accent: #2448B8; --accent-ink: #FFFFFF;
      --done: #1E8A5F; --danger: #C2412D; --field: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1730; --grid: #17254A; --panel: #142142; --line: #2A3C68;
        --text: #E6ECFA; --muted: #8E9BBB; --accent: #7EA6FF; --accent-ink: #0E1730;
        --done: #4FD1A1; --danger: #FF8A73; --field: #101C3A;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "Bricolage Grotesque", system-ui, "Segoe UI", sans-serif;
      font-size: 17px; line-height: 1.5;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    button { font: inherit; cursor: pointer; color: inherit; }

    .layout {
      max-width: 1040px; margin: 0 auto; padding: 64px 24px;
      display: grid; grid-template-columns: 300px 1fr; gap: 64px; align-items: start;
    }

    /* Sidebar */
    .side { position: sticky; top: 48px; }
    h1 {
      font-size: 72px; font-weight: 800; line-height: 0.95;
      letter-spacing: -0.03em; color: var(--accent); margin: 0 0 16px;
    }
    .intro { color: var(--muted); margin: 0 0 32px; max-width: 34ch; }
    .status {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 20px;
    }
    .status-row { display: flex; align-items: center; gap: 10px; font-weight: 500; }
    .latency { margin-left: auto; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.ok { background: var(--done); box-shadow: 0 0 0 4px color-mix(in srgb, var(--done) 22%, transparent); }
    .dot.down { background: var(--danger); box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 22%, transparent); }
    .counts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      margin: 20px 0; padding: 20px 0 0; border-top: 1px solid var(--line);
    }
    .counts div { margin: 0; }
    .counts dt { color: var(--muted); font-size: 15px; }
    .counts dd { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .progress span { display: block; height: 100%; width: 0; background: var(--done); transition: width .4s ease; }
    .progress-label { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
    .repo { display: inline-block; margin-top: 24px; color: var(--accent); font-weight: 500; text-underline-offset: 4px; }

    /* Board */
    .board { min-width: 0; padding-top: 12px; }
    form { display: flex; gap: 8px; }
    input[type=text] {
      flex: 1; min-width: 0; font: inherit; padding: 14px 16px;
      border: 2px solid var(--line); border-radius: 8px;
      background: var(--field); color: var(--text);
    }
    input[type=text]:focus { border-color: var(--accent); outline: none; }
    .add {
      padding: 14px 22px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--accent-ink); font-weight: 700;
    }
    .error { color: var(--danger); min-height: 1.5em; margin: 8px 0 16px; }

    .filters {
      display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 24px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    }
    .filters button { border: none; background: none; color: var(--muted); padding: 6px 14px; border-radius: 6px; }
    .filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }

    /* The pipeline rail */
    .rail { list-style: none; margin: 0; padding: 0; }
    .rail li {
      position: relative; display: flex; align-items: center; gap: 16px;
      min-height: 68px; padding: 14px 0 14px 52px;
    }
    .rail li::before {
      content: ""; position: absolute; left: 13px; top: 0; bottom: 0;
      width: 2px; background: var(--line); transition: background-color .3s;
    }
    .rail li:first-child::before { top: 50%; }
    .rail li:last-child::before { bottom: 50%; }
    .rail li.done::before { background: var(--done); }
    .node {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; padding: 0; border-radius: 50%;
      border: 2px solid var(--line); background: var(--bg);
      display: grid; place-items: center; color: transparent;
      transition: background-color .2s, border-color .2s, color .2s;
    }
    .node:hover { border-color: var(--done); }
    .node svg { width: 16px; height: 16px; }
    .rail li.done .node { background: var(--done); border-color: var(--done); color: var(--bg); }
    .task { flex: 1; min-width: 0; }
    .title { display: block; font-weight: 500; overflow-wrap: anywhere; transition: color .2s; }
    .meta { font-size: 14px; color: var(--muted); }
    .rail li.done .title {
      color: var(--muted); text-decoration: line-through;
      text-decoration-color: var(--done); text-decoration-thickness: 2px;
    }
    .delete {
      border: 1px solid var(--line); background: var(--panel); color: var(--muted);
      padding: 6px 12px; border-radius: 6px; font-size: 15px;
    }
    .delete:hover { color: var(--danger); border-color: var(--danger); }
    @media (hover: hover) {
      .delete { opacity: 0; }
      .rail li:hover .delete, .delete:focus-visible { opacity: 1; }
    }
    .rail li.empty { padding-left: 0; color: var(--muted); }
    .rail li.empty::before { display: none; }

    :focus-visible { outline: 3px solid var(--done); outline-offset: 2px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; gap: 40px; padding: 40px 20px; }
      .side { position: static; }
      h1 { font-size: 56px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <h1>Tasks</h1>
      <p class="intro">A Java REST API built with Gradle, tested on every push and delivered by a CI/CD pipeline. Made for the CodeAlpha DevOps internship.</p>

      <section class="status" aria-label="Service status">
        <div class="status-row">
          <span class="dot" id="dot"></span>
          <span id="api-state">Checking API…</span>
          <span class="latency" id="latency"></span>
        </div>
        <dl class="counts">
          <div><dt>Open</dt><dd id="open-count">0</dd></div>
          <div><dt>Done</dt><dd id="done-count">0</dd></div>
        </dl>
        <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Tasks completed">
          <span id="bar"></span>
        </div>
        <p class="progress-label" id="progress-label">No tasks yet</p>
      </section>

      <a class="repo" href="https://github.com/rayyanmajid344-creator/CodeAlpha_JavaGradleApp">View the source on GitHub</a>
    </aside>

    <main class="board">
      <form id="add-form">
        <label for="new-title" class="visually-hidden">New task</label>
        <input type="text" id="new-title" placeholder="What needs doing?" maxlength="200" autocomplete="off">
        <button type="submit" class="add">Add task</button>
      </form>
      <p class="error" id="error" role="alert"></p>

      <div class="filters" role="group" aria-label="Show tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="open" aria-pressed="false">Open</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>

      <ol class="rail" id="list"></ol>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const list = $('list');
    const input = $('new-title');
    const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    let tasks = [];
    let filter = 'all';

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Request failed (${res.status})`);
      }
      return res.status === 204 ? null : res.json();
    }

    function showError(message) { $('error').textContent = message; }
    function clearError() { $('error').textContent = ''; }

    function renderStats() {
      const done = tasks.filter(t => t.done).length;
      const open = tasks.length - done;
      const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
      $('open-count').textContent = open;
      $('done-count').textContent = done;
      $('bar').style.width = pct + '%';
      $('progress').setAttribute('aria-valuenow', pct);
      $('progress-label').textContent = tasks.length
        ? `${done} of ${tasks.length} tasks done`
        : 'No tasks yet';
    }

    function render() {
      renderStats();
      const visible = tasks.filter(t =>
        filter === 'all' || (filter === 'done' ? t.done : !t.done));

      list.replaceChildren();
      if (visible.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty';
        if (filter === 'done') li.textContent = 'No finished tasks yet.';
        else if (filter === 'open' && tasks.length > 0) li.textContent = 'Everything is done.';
        else li.textContent = 'Add a task above to get started.';
        list.append(li);
        return;
      }

      for (const task of visible) {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        const node = document.createElement('button');
        node.type = 'button';
        node.className = 'node';
        node.setAttribute('role', 'checkbox');
        node.setAttribute('aria-checked', String(task.done));
        node.setAttribute('aria-label', `Mark "${task.title}" as done`);
        node.innerHTML = CHECK;
        node.addEventListener('click', () => update(task.id, !task.done));

        const info = document.createElement('div');
        info.className = 'task';
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = task.title;
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = `Task #${task.id}`;
        info.append(title, meta);

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete';
        del.textContent = 'Delete';
        del.setAttribute('aria-label', `Delete "${task.title}"`);
        del.addEventListener('click', () => remove(task.id));

        li.append(node, info, del);
        list.append(li);
      }
    }

    async function load() {
      try {
        tasks = await api('GET', '/api/tasks');
        render();
      } catch (e) {
        showError('Could not load tasks. Check that the server is running.');
      }
    }

    async function update(id, done) {
      try {
        const updated = await api('PATCH', `/api/tasks/${id}`, { done });
        tasks = tasks.map(t => t.id === id ? updated : t);
        clearError();
      } catch (e) {
        showError(e.message);
      }
      render();
    }

    async function remove(id) {
      try {
        await api('DELETE', `/api/tasks/${id}`);
        tasks = tasks.filter(t => t.id !== id);
        clearError();
        render();
      } catch (e) {
        showError(e.message);
      }
    }

    async function checkHealth() {
      const start = performance.now();
      try {
        const res = await fetch('/health', { cache: 'no-store' });
        if (!res.ok) throw new Error();
        const ms = Math.round(performance.now() - start);
        $('dot').className = 'dot ok';
        $('api-state').textContent = 'API online';
        $('latency').textContent = `${ms} ms`;
      } catch (e) {
        $('dot').className = 'dot down';
        $('api-state').textContent = 'API unreachable';
        $('latency').textContent = '';
      }
    }

    $('add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const task = await api('POST', '/api/tasks', { title: input.value });
        tasks.push(task);
        input.value = '';
        clearError();
        render();
      } catch (e) {
        showError(e.message);
      }
      input.focus();
    });

    document.querySelectorAll('.filters button').forEach(button => {
      button.addEventListener('click', () => {
        filter = button.dataset.filter;
        document.querySelectorAll('.filters button').forEach(b =>
          b.setAttribute('aria-pressed', String(b === button)));
        render();
      });
    });

    load();
    checkHealth();
    setInterval(checkHealth, 10000);
  </script>
</body>
</html>
