name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build, test and check coverage
        run: ./gradlew build

      - name: Upload packaged app
        uses: actions/upload-artifact@v5
        with:
          name: task-manager-app
          path: app/build/distributions/

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/test/
            app/build/reports/jacoco/test/html/